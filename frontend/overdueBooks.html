<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overdue Books | LMS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<img src="nit-kkr-logo.jpeg">
<img src="image copy 15.png">
</header>

<main class="stu_fac_dashboard">

<section class="welcome">
<h2>Overdue Books ⚠</h2>
<p>Books that crossed the due date</p>
</section>

<section class="table_of_books">

<table class="booktable">

<thead>
<tr>
<th>Book ID</th>
<th>Title</th>
<th>Author</th>
<th>Due Date</th>
<th>Fine</th>
</tr>
</thead>

<tbody id="booksTableBody">
</tbody>

</table>

</section>

</main>
<script src="script.js"></script>

<script>

async function loadMyOverdueBooks(){

    try {

        const result = await BorrowService.getMyOverdue();

        const records = result.data;

        const tableBody = document.getElementById("booksTableBody");
        tableBody.innerHTML = "";

        records.forEach(record => {

            const book = record.book;

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${book._id}</td>
                <td>${book.title}</td>
                <td>${book.author}</td>
                <td>${new Date(record.dueDate).toLocaleDateString()}</td>
                <td>₹${record.fine}</td>
            `;

            tableBody.appendChild(row);

        });

    } catch (error) {
        console.error("Error loading overdue books:", error.message);
    }
}

loadMyOverdueBooks();

</script>

</body>
</html>
